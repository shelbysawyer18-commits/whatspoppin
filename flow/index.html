<style>

main{width:min(1180px,calc(100% - 28px));margin:0 auto;padding-bottom:44px}.intro{padding:26px 0 18px;display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}.kicker{font-size:11px;color:var(--red);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.intro h1,.inner h2{font-family:"Archivo Black",Arial Black,sans-serif;font-size:clamp(30px,5vw,52px);letter-spacing:-.05em;line-height:1.05;margin:8px 0 11px}.intro p,.inner .note{font-size:14px;line-height:1.55;color:var(--muted);margin:0;max-width:610px}.toolbar{display:flex;gap:7px;align-items:center}.toolbar button,.back{border:1.5px solid var(--ink);background:#fffdf7;color:var(--ink);border-radius:0;padding:9px 14px;min-height:40px;font-size:13px;font-weight:700}.toolbar button:hover,.back:hover{background:var(--gold)}
.space-wrap{padding:0}.space{position:relative;height:clamp(430px,62vh,690px);border:2px solid var(--ink);background:#fbf6e9;overflow:hidden;touch-action:none;cursor:grab;box-shadow:5px 6px 0 #17141215}.space.dragging{cursor:grabbing}.space:before{content:"";pointer-events:none;position:absolute;inset:0;opacity:.55;background-image:radial-gradient(#c9b89a .8px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(ellipse at center,#000,transparent 92%)}.center{position:absolute;left:50%;top:50%;width:0;height:0}.word{position:absolute;left:0;top:0;border:0;background:none;padding:10px 14px;line-height:1;white-space:nowrap;font-family:"Archivo Black",Arial Black,sans-serif;letter-spacing:-.055em;user-select:none;touch-action:none;transform-origin:center;filter:none;transition:color .15s}.word:hover,.word:focus-visible{color:var(--red)!important}.info,.index{position:absolute;pointer-events:none;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em}.info{bottom:14px;left:15px}.index{top:14px;right:15px;background:var(--gold);border:1px solid var(--ink);color:var(--ink);padding:5px 7px}.footnote{font-size:11px;color:var(--muted);padding:13px 2px 25px;text-align:left}.view{display:none}.view.on{display:block}

@media(max-width:650px){header{align-items:flex-start;flex-wrap:wrap;padding:15px 0}.brand{font-size:25px}.nav{width:100%;gap:5px}.nav a{flex:1;text-align:center;padding:8px 5px}.intro{padding:23px 0 15px;gap:14px}.intro h1{font-size:41px;margin:7px 0 7px}.intro p{font-size:14px;line-height:1.45}.toolbar{width:100%;gap:7px}.toolbar button{min-width:48px;min-height:42px}.space{height:min(62dvh,590px);min-height:425px;box-shadow:3px 4px 0 #17141215}.word{padding:8px 10px;letter-spacing:-.045em}.index{font-size:9px;top:10px;right:10px}.info{left:10px;bottom:10px;font-size:9px}.footnote{padding:2px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}.detail{grid-template-columns:1fr}.detail .hero{max-width:240px}}

</style></head><body><header><a href="/" class="brand">what's <em>poppin?</em></a><nav class="nav"><a href="/#create">Create</a><a href="/#profile">Profile</a><a href="/flow/" class="active">Flow</a></nav></header><main>
<section class="view on" id="universe"><div class="intro"><div><div class="kicker">DISCOVER</div><h1>Flow.</h1><p>Explore the words people use in real movie reviews.</p></div><div class="toolbar"><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="reset">Recenter</button></div></div><div class="space-wrap"><div class="space" id="space" aria-label="Interactive word universe"><div class="center" id="center"></div><div class="index">EXPLORE / 01</div><div class="info">DRAG TO EXPLORE · TAP A WORD</div></div></div><div class="footnote" id="communityStatus" role="status" aria-live="polite">Loading community words…</div></section>
<section class="view" id="results"><div class="inner"><button class="back" id="backWords">← All words</button><div class="count" id="matchCount"></div><h2 id="resultWord"></h2><p class="note">Actual review cards made by the community using this word.</p><div class="grid" id="filmGrid"></div><p class="status" id="filmStatus" aria-live="polite"></p></div></section>

</main><script>
(()=>{
'use strict';
// Curated discovery associations, not fabricated user reviews or ratings.
const films=[
 {id:244786,title:'Whiplash',year:2014,words:['intense','obsessive','chaotic','electric','anxious']},
 {id:694,title:'The Shining',year:1980,words:['unsettling','haunting','strange','hypnotic','intense']},
 {id:146233,title:'Prisoners',year:2013,words:['intense','unsettling','gritty','anxious','heartbreaking']},
 {id:44214,title:'Black Swan',year:2010,words:['intense','obsessive','beautiful','unsettling','surreal']},
 {id:254320,title:'The Lobster',year:2015,words:['strange','unsettling','funny','surreal','quiet']},
 {id:313369,title:'La La Land',year:2016,words:['beautiful','nostalgic','heartbreaking','dreamlike','hopeful']},
 {id:545611,title:'Everything Everywhere All at Once',year:2022,words:['chaotic','beautiful','surreal','heartbreaking','warm']},
 {id:473033,title:'Uncut Gems',year:2019,words:['intense','chaotic','anxious','unpredictable','electric']},
 {id:653708,title:'Shiva Baby',year:2020,words:['anxious','funny','chaotic','unsettling','raw']},
 {id:615777,title:'Babylon',year:2022,words:['chaotic','electric','beautiful','dizzying','nostalgic']},
 {id:1091,title:'The Thing',year:1982,words:['unsettling','visceral','intense','unpredictable','strange']},
 {id:666277,title:'Past Lives',year:2023,words:['beautiful','nostalgic','tender','melancholy','quiet']},
 {id:120467,title:'The Grand Budapest Hotel',year:2014,words:['beautiful','funny','nostalgic','warm','dreamlike']},
 {id:38,title:'Eternal Sunshine of the Spotless Mind',year:2004,words:['heartbreaking','beautiful','dreamlike','nostalgic','melancholy']},
 {id:965150,title:'Aftersun',year:2022,words:['heartbreaking','quiet','tender','nostalgic','raw']}
];
let seeds=[['intense',82,12,7,80],['beautiful',71,-320,-103,-35],['chaotic',68,340,-120,25],['nostalgic',55,-130,200,12],['unsettling',67,460,168,-40],['heartbreaking',52,-500,130,-70],['dreamlike',43,570,-320,-95],['obsessive',39,-600,-240,36],['funny',49,35,-300,-90],['haunting',44,780,0,75],['tender',28,-860,330,15],['surreal',42,205,410,-75],['anxious',38,830,400,-45],['electric',36,-970,-95,-65],['melancholy',30,1050,-210,-80],['gritty',28,-335,525,52],['hypnotic',30,1185,180,40],['visceral',28,-1000,-450,-40],['hopeful',30,460,610,35],['unpredictable',33,-750,570,-100],['warm',31,100,-530,25],['dizzying',25,1260,530,-70],['quiet',29,-1240,170,10],['raw',31,-115,-640,30],['strange',31,760,-620,-25],['magnetic',24,-1260,590,45]];
const $=id=>document.getElementById(id),space=$('space'),center=$('center');
const show=id=>{for(const v of ['universe','results','movie'])$(v).classList.toggle('on',v===id);window.scrollTo(0,0)};
const camera={x:0,y:0,z:1};let chosen='',active=null,drag=null,suppress=false;let touches=new Map(),pinch=null;
const palette=['#171412','#c4282b','#3d3832','#2f7f86','#745f35'];
let words=seeds.map(([name,sz,x,y,depth],i)=>{let b=document.createElement('button');b.className='word';b.textContent=name;b.type='button';b.style.fontSize=sz+'px';b.style.color=palette[i%palette.length];b.style.fontWeight=sz>65?'800':'660';b.addEventListener('click',()=>{if(!suppress)openWord(name)});center.append(b);return{el:b,x,y,depth}});
// Organic, measured mobile constellation. Every position is deterministic:
// no random jumping after a resize, and no fake ratings or generated art.
let mobileLayout=[];let mobileWidth=0;let mobileHeight=0;
function layoutMobile(){
 const width=space.clientWidth,height=space.clientHeight;
 if(mobileWidth===width && mobileHeight===height && mobileLayout.length)return;
 mobileWidth=width;mobileHeight=height;
 const entries=words.map((word,i)=>{
   // Keep personality in the typography without swallowing the mobile canvas.
   const font=Math.max(20,Math.min(37,Math.round(seeds[i][1]*.48)));
   word.el.style.fontSize=font+'px';
   const w=Math.ceil(word.el.offsetWidth),h=Math.ceil(word.el.offsetHeight);
   return{el:word.el,w,h,i};
 });
 // Place words across a genuine two-dimensional field. The rejection check
 // reserves the entire touchable word rectangle, rather than only its center.
 const placed=[];mobileLayout=[];
 const golden=2.399963229728653;
 const safeGap=19;
 for(const item of entries){
   let chosen=null;
   for(let attempt=0;attempt<520;attempt++){
     const k=item.i+attempt*.105;
     const angle=(item.i*golden)+(attempt*.71);
     const radius=(item.i===0?0:74+Math.sqrt(item.i)*59)+attempt*5.5;
     // Keep the first cluster within reasonable mobile panning distance,
     // then extend the space organically in both X and Y.
     const x=Math.sin(angle)*radius*.83;
     const y=Math.cos(angle)*radius*1.12;
     const box={left:x-item.w/2,right:x+item.w/2,top:y-item.h/2,bottom:y+item.h/2};
     if(placed.every(p=>box.right+safeGap<p.left || box.left-safeGap>p.right || box.bottom+safeGap<p.top || box.top-safeGap>p.bottom)){
       chosen={x,y,box};break;
     }
   }
   if(!chosen){ // Deterministic fallback far to the lower-right; never overlap.
     const x=(item.i%2?1:-1)*(width*.85),y=900+item.i*92;
     chosen={x,y,box:{left:x-item.w/2,right:x+item.w/2,top:y-item.h/2,bottom:y+item.h/2}};
   }
   placed.push(chosen.box);
   mobileLayout.push({el:item.el,x:chosen.x,y:chosen.y});
 }
}
// Used only by the community integration. Keeps the original drag/pinch renderer.
window.wpFlowSetWords=function(counts){
 if(!Array.isArray(counts))return;
 const previous=new Map(seeds.map(([name,sz,x,y,depth])=>[name,{sz,x,y,depth}]));
 const spiral=2.399963229728653;
 const normalized=counts.filter(row=>typeof row.word==='string'&&Number(row.count)>0).slice(0,80);
 for(const w of words)w.el.remove();
 seeds=normalized.map((entry,i)=>{
   const name=entry.word;
   const old=previous.get(name);
   const radius=85+Math.sqrt(i+1)*125;
   const x=old?.x??Math.cos(i*spiral)*radius;
   const y=old?.y??Math.sin(i*spiral)*radius;
   const depth=old?.depth??0;
   const size=Math.min(76,Math.max(22,24+Math.log2(Number(entry.count)+1)*11));
   return[name,size,x,y,depth];
 });
 words=seeds.map(([name,sz,x,y,depth],i)=>{
   const b=document.createElement('button');b.className='word';b.type='button';b.textContent=name;
   b.style.fontSize=sz+'px';b.style.color=palette[i%palette.length];
   b.addEventListener('click',()=>{if(!suppress)window.wpFlowOpenCommunity?.(name)});
   center.appendChild(b);return{el:b,x,y,depth};
 });
 mobileWidth=mobileHeight=0;mobileLayout=[];camera.x=0;camera.y=0;camera.z=1;draw();
};
window.wpFlowShow=function(id){show(id)};
function draw(){
 if(window.matchMedia('(max-width:650px)').matches){
   layoutMobile();
   for(const {el,x,y} of mobileLayout){
     const cx=(x-camera.x)*camera.z,cy=(y-camera.y)*camera.z;
     el.style.transform=`translate(calc(-50% + ${cx}px),calc(-50% + ${cy}px)) scale(${camera.z})`;
   }
 }else{
   mobileWidth=mobileHeight=0;mobileLayout=[];
   const scale=Math.min(1,space.clientWidth/1000);
   for(const [i,{el,x,y,depth}] of words.entries()){
     el.style.fontSize=seeds[i][1]+'px';
     const par=1+depth/900;
     const cx=(x-camera.x)*camera.z*scale*par,cy=(y-camera.y)*camera.z*scale*par;
     const size=Math.max(.55,Math.min(1.8,camera.z*par));
     el.style.transform=`translate(calc(-50% + ${cx}px),calc(-50% + ${cy}px)) scale(${size})`;
   }
 }
}
if(document.fonts?.ready)document.fonts.ready.then(()=>{mobileWidth=0;draw()});
function zoom(f){camera.z=Math.min(2.2,Math.max(.48,camera.z*f));draw()}
$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);$('reset').onclick=()=>{camera.x=0;camera.y=0;camera.z=1;draw()};
space.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.08:.92)},{passive:false});
space.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,cx:camera.x,cy:camera.y};suppress=false}else if(touches.size===2){let [a,b]=[...touches.values()];pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),z:camera.z};drag=null;suppress=true}});
space.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&pinch){let [a,b]=[...touches.values()];camera.z=Math.min(2.2,Math.max(.48,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch.distance)));draw();return}if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>7){suppress=true;space.classList.add('dragging');try{space.setPointerCapture(e.pointerId)}catch{}}if(suppress){let k=(window.matchMedia("(max-width:650px)").matches?1:Math.min(1,space.clientWidth/1000))*camera.z;camera.x=drag.cx-dx/k;camera.y=drag.cy-dy/k;draw()}});
function end(e){touches.delete(e.pointerId);if(touches.size<2)pinch=null;if(!touches.size){drag=null;space.classList.remove('dragging');setTimeout(()=>{suppress=false},100)}}space.addEventListener('pointerup',end);space.addEventListener('pointercancel',end);window.addEventListener('resize',()=>{mobileWidth=mobileHeight=0;draw()});
const cache=new Map();
async function getPoster(f){
 if(cache.has(f.id))return cache.get(f.id);
 const p=(async()=>{
   // The existing /api/tmdb/search endpoint returns RAW TMDB fields
   // (poster_path, release_date, numeric id), not posterPath/releaseYear.
   try{
     const controller=new AbortController();
     const timer=setTimeout(()=>controller.abort(),12000);
     let response;
     try{response=await fetch('/api/tmdb/search?q='+encodeURIComponent(f.title),{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer)}
     if(!response.ok)return null;
     const data=await response.json();
     const entries=Array.isArray(data.results)?data.results:[];
     const match=entries.find(m=>Number(m.id??m.tmdbId)===f.id)
       || entries.find(m=>String(m.title||m.original_title||'').toLowerCase()===f.title.toLowerCase() && Number(String(m.release_date||m.releaseDate||m.releaseYear||'').slice(0,4))===f.year)
       || entries.find(m=>String(m.title||m.original_title||'').toLowerCase()===f.title.toLowerCase());
     const poster=match?.poster_path||match?.posterPath;
     if(!poster)return null;
     if(poster.startsWith('/api/')||poster.startsWith('/posters/')||poster.startsWith('data:'))return poster;
     const path=poster.match(/image\.tmdb\.org\/t\/p\/(?:w\d+|original)(\/[^?]+)/)?.[1]||poster;
     if(path.startsWith('http'))return path;
     return '/api/tmdb/image?path='+encodeURIComponent(path.startsWith('/')?path:'/'+path)+'&size=w500';
   }catch(err){console.warn('Flow movie poster search unavailable',f.title,err);return null}
 })();
 cache.set(f.id,p);return p;
}
function imgFrame(f){
 const wrap=document.createElement('div');wrap.className='image';
 const label=document.createElement('span');label.className='missing';label.textContent='Loading poster…';wrap.append(label);
 getPoster(f).then(url=>{
   if(!url){label.textContent='Poster unavailable';return}
   const img=new Image();img.alt=f.title+' movie poster';img.decoding='async';
   // Do NOT mark detached Image objects lazy: mobile browsers may never load them.
   img.onload=()=>wrap.replaceChildren(img);
   img.onerror=()=>{label.textContent='Poster unavailable';console.warn('Flow poster image could not load:',url)};
   img.src=url;
 }).catch(()=>{label.textContent='Poster unavailable'});
 return wrap;
}
function openWord(word){chosen=word;$('resultWord').textContent=word;$('filmGrid').replaceChildren();let found=films.filter(f=>f.words.includes(word));$('matchCount').textContent=found.length+' curated films';$('filmStatus').textContent='';for(let f of found){let b=document.createElement('button');b.className='film';b.type='button';b.append(imgFrame(f));let h=document.createElement('h3');h.textContent=f.title;let sub=document.createElement('small');sub.textContent=f.year+' · View movie';b.append(h,sub);b.onclick=()=>openMovie(f);$('filmGrid').append(b)}if(!found.length)$('filmStatus').textContent='No selections for this word yet.';show('results')}
function openMovie(f){active=f;let dest=$('movieDetail');dest.replaceChildren();let section=document.createElement('div');section.className='detail';let wrap=imgFrame(f);wrap.className='hero';let info=document.createElement('div');let kicker=document.createElement('div');kicker.className='kicker';kicker.textContent='Film / '+f.year;let title=document.createElement('h2');title.textContent=f.title;let desc=document.createElement('p');desc.className='summary';desc.textContent='A film for this mood.';let tags=document.createElement('div');for(const word of f.words){let tag=document.createElement('span');tag.className='tag';tag.textContent=word;tags.append(tag)}let review=document.createElement('div');review.className='review';let heading=document.createElement('h3');heading.textContent='Community reviews';let status=document.createElement('p');status.textContent='Reviews will appear here when community reviews are connected.';review.append(heading,status);info.append(kicker,title,desc,tags,review);section.append(wrap,info);dest.append(section);show('movie')}
$('backWords').onclick=()=>show('universe');$('backMovies').onclick=()=>show('results');draw();
})();
</script><script type="module" src="/flow/community.js"></script></body></html>
